<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="loginModalLabel">Iniciar sesión</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form id="loginForm" class="">

          <div class="mb-3">
            <label for="login-email" class="col-form-label">Email:</label>
            <input
              type="email"
              class="form-control"
              id="login-email"
              placeholder="tu@email.com"
              minlength="3"
              maxlength="30"
              required
            >
           
          </div>

          <div class="mb-3">
            <label for="login-password" class="col-form-label">Contraseña:</label>
            <input
              type="password"
              class="form-control"
              id="login-password"
              placeholder="••••••••"
              required minlength="8"
              required maxlength="20"
              required
            >
           
          </div>

          <div class="mb-3 form-check d-flex justify-content-between align-items-center">
            <div>
              <input type="checkbox" class="form-check-input" id="remember-me">
              <label class="form-check-label" for="remember-me">Recordarme</label>
            </div>
            <a href="#" class="small">¿Olvidaste tu contraseña?</a>
          </div>

        </form>

        <p class="text-center mt-3 mb-0">
          ¿No tenés cuenta?
          <a href="/Pages/suscripcion.html">Suscribite acá</a>
        </p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button onclick="window.location.href='inicio.html'" type="submit" form="loginForm"  class="btn-suscribite">
          Iniciar sesión
        </button>
      </div>
    </div>
  </div>
